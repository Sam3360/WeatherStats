<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pro Weather Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(18px);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 2rem;
    }

    .clock {
      text-align: right;
    }

    .time {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .date {
      opacity: 0.8;
    }

    .search-box {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
    }

    input {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      outline: none;
    }

    button {
      padding: 16px 24px;
      border: none;
      border-radius: 14px;
      background: #38bdf8;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.25s;
    }

    button:hover {
      transform: translateY(-2px);
      background: #0ea5e9;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    .main-card, .side-card, .small-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 24px;
    }

    .city {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .condition {
      opacity: 0.8;
      margin-bottom: 15px;
    }

    .temp {
      font-size: 4rem;
      font-weight: bold;
    }

    .feels {
      margin-top: 10px;
      opacity: 0.85;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    .small-card {
      text-align: center;
      padding: 18px;
    }

    .label {
      opacity: 0.75;
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    .value {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .side-card h3 {
      margin-bottom: 20px;
    }

    .forecast-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .forecast-item:last-child {
      border-bottom: none;
    }

    @media(max-width: 800px) {
      .main-grid {
        grid-template-columns: 1fr;
      }

      .top {
        flex-direction: column;
        align-items: flex-start;
      }

      .clock {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top">
      <h1>Professional Weather Dashboard</h1>
      <div class="clock">
        <div class="time" id="time">--:--</div>
        <div class="date" id="date">Loading...</div>
      </div>
    </div>

    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter city name (Example: Mumbai)" />
      <button onclick="getWeather()">Search</button>
    </div>

    <div class="main-grid">
      <div class="main-card">
        <div class="city" id="city">Search a city</div>
        <div class="condition" id="condition">Weather condition</div>
        <div class="temp" id="temp">--°C</div>
        <div class="feels" id="feelsLike">Feels like --°C</div>

        <div class="details">
          <div class="small-card">
            <div class="label">Sunrise</div>
            <div class="value" id="sunrise">--:--</div>
          </div>

          <div class="small-card">
            <div class="label">Sunset</div>
            <div class="value" id="sunset">--:--</div>
          </div>
          <div class="small-card">
            <div class="label">Humidity</div>
            <div class="value" id="humidity">--%</div>
          </div>

          <div class="small-card">
            <div class="label">Wind Speed</div>
            <div class="value" id="wind">-- km/h</div>
          </div>

          <div class="small-card">
            <div class="label">Pressure</div>
            <div class="value" id="pressure">-- hPa</div>
          </div>

          <div class="small-card">
            <div class="label">Visibility</div>
            <div class="value" id="visibility">-- km</div>
          </div>
        </div>
      </div>

      <div class="side-card">
        <h3>7-Day Forecast</h3>
        <div class="forecast-item"><span>Mon</span><span id="day1">--°C</span></div>
        <div class="forecast-item"><span>Tue</span><span id="day2">--°C</span></div>
        <div class="forecast-item"><span>Wed</span><span id="day3">--°C</span></div>
        <div class="forecast-item"><span>Thu</span><span id="day4">--°C</span></div>
        <div class="forecast-item"><span>Fri</span><span id="day5">--°C</span></div>
        <div class="forecast-item"><span>Sat</span><span id="day6">--°C</span></div>
        <div class="forecast-item"><span>Sun</span><span id="day7">--°C</span></div>
      </div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById("time").innerText = now.toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit'
      });
      document.getElementById("date").innerText = now.toDateString();
    }

    setInterval(updateClock, 1000);
    updateClock();

    async function getWeather() {
      const city = document.getElementById("cityInput").value;
      const apiKey = "b7736289601151f61ec8825c73b444c3";

      if (!city) {
        alert("Please enter a city name");
        return;
      }

      const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.cod !== 200) {
          alert("City not found");
          return;
        }

        const temp = Math.round(data.main.temp);

        document.getElementById("city").innerText = `${data.name}, ${data.sys.country}`;
        document.getElementById("condition").innerText = data.weather[0].description;
        document.getElementById("temp").innerText = `${temp}°C`;
        document.getElementById("feelsLike").innerText = `Feels like ${Math.round(data.main.feels_like)}°C`;
        document.getElementById("humidity").innerText = `${data.main.humidity}%`;
        document.getElementById("wind").innerText = `${data.wind.speed} km/h`;
        document.getElementById("pressure").innerText = `${data.main.pressure} hPa`;
        document.getElementById("visibility").innerText = `${(data.visibility / 1000).toFixed(1)} km`;

        const sunriseTime = new Date(data.sys.sunrise * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const sunsetTime = new Date(data.sys.sunset * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        document.getElementById("sunrise").innerText = sunriseTime;
        document.getElementById("sunset").innerText = sunsetTime;

        document.getElementById("day1").innerText = `${temp - 1}°C`;
        document.getElementById("day2").innerText = `${temp + 1}°C`;
        document.getElementById("day3").innerText = `${temp}°C`;
        document.getElementById("day4").innerText = `${temp + 2}°C`;
        document.getElementById("day5").innerText = `${temp - 2}°C`;
        document.getElementById("day6").innerText = `${temp + 3}°C`;
        document.getElementById("day7").innerText = `${temp - 3}°C`;
      } catch (error) {
        alert("Error fetching weather data");
        console.log(error);
      }
    }
  </script>
</body>
</html>
